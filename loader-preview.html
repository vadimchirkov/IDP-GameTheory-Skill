<!doctype html><meta charset="utf-8"><style>:root {
  color-scheme: dark;
  --bg: #171717;
  --sidebar: #121212;
  --panel: #151515;
  --surface: #202020;
  --surface-hover: #272727;
  --ink: #ececec;
  --muted: #8b8b8b;
  --muted-strong: #b4b4b4;
  --line: rgba(255, 255, 255, .055);
  --line-strong: rgba(255, 255, 255, .11);
  --accent: #fff;
  --accent-hover: #e8e8e8;
  --accent-soft: rgba(255, 255, 255, .09);
  --good: #67b99f;
  --bad: #e47972;
  --situations: 252px;
  --runs: 320px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
}

* { box-sizing: border-box }
html, body, #app { height: 100% }
* { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .16) transparent }
*::-webkit-scrollbar { width: 8px; height: 8px }
*::-webkit-scrollbar-track { background: transparent }
*::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: rgba(255, 255, 255, .16); background-clip: padding-box }
*::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .25); background-clip: padding-box }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  font-synthesis: none;
}
button, input, textarea, select { font: inherit; color: inherit }
button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 9px; background: var(--surface); padding: 0 12px; line-height: 1; cursor: pointer; transition: background-color 160ms ease, color 160ms ease, opacity 160ms ease, transform 120ms ease }
button:hover { background: var(--surface-hover) }
button:active { transform: scale(.98) }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid rgba(255, 255, 255, .28); outline-offset: 2px }
button:disabled { opacity: .42; cursor: not-allowed; transform: none }
.primary { background: var(--accent); color: #171717; font-weight: 570 }
.primary:hover { background: var(--accent-hover) }
.danger { color: var(--bad) }
.quiet { border-color: transparent; background: transparent; color: var(--muted-strong) }
.icon { width: 34px; padding: 0; flex: 0 0 auto }
.ui-icon { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round }

.app { height: 100%; display: grid; grid-template-columns: var(--situations) var(--runs) minmax(0, 1fr); padding-right: 0; transition: grid-template-columns 180ms cubic-bezier(.2, .8, .2, 1), padding-right 200ms ease-out }
.app.agent-open { padding-right: 398px }
.app.hide-situations { grid-template-columns: 0 var(--runs) minmax(0, 1fr) }
.app.hide-runs { grid-template-columns: var(--situations) 0 minmax(0, 1fr) }
.app.hide-situations.hide-runs { grid-template-columns: 0 0 minmax(0, 1fr) }
.pane { min-width: 0; height: 100%; overflow: hidden; box-shadow: 1px 0 var(--line); transition: visibility 0s }
.pane-head { height: 52px; display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; gap: 6px; padding: 0 8px }
.pane-title { min-width: 0 }
.pane-title b, .pane-title span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pane-title b { font-size: 12px; font-weight: 590 }
.pane-title span { color: var(--muted); font-size: 10px }
.situations { display: flex; flex-direction: column; background: var(--sidebar) }
.situations > .pane-head, .situations > .tasks, .situations > .sidebar-footer { width: var(--situations); flex: 0 0 auto }
.situations > .tasks { flex-grow: 1 }
.run-pane > .pane-head, .run-pane > .run-scroll { width: var(--runs) }
.hide-situations .situations, .hide-runs .run-pane { visibility: hidden; transition-delay: 180ms }
.brand { min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 620; letter-spacing: -.01em }
.situations .pane-head .primary { border-radius: 50% }
.tasks { flex: 1; min-height: 0; padding: 4px 7px 10px; overflow: auto; overscroll-behavior: contain }
.task-row { position: relative; margin-bottom: 2px }
.task { position: relative; display: block; width: 100%; min-height: 58px; padding: 10px 12px; border-radius: 10px; color: inherit; text-align: left; text-decoration: none; transition: background-color 150ms ease }
.task:hover { background: rgba(255, 255, 255, .045) }
.task[aria-current=page] { background: var(--surface) }
.task[aria-current=page]::before { position: absolute; inset: 12px auto 12px 2px; width: 2px; border-radius: 2px; background: var(--ink); content: "" }
.task:focus-visible { outline: 0; box-shadow: inset 0 0 0 1px var(--line-strong) }
.task-title { display: -webkit-box; overflow: hidden; font-size: 12px; font-weight: 570; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2 }
.task-meta { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 9px }
.task-meta span { display: flex; align-items: center }
.task-meta time { flex: 0 0 auto; transition: opacity 160ms ease }
.row-delete { position: absolute; opacity: 0; color: var(--muted); transition: opacity 160ms ease, color 160ms ease }
.task-row .row-delete { right: 6px; bottom: 5px; width: 28px; min-height: 28px }
.run-row .row-delete { top: 8px; right: 5px }
.task-row:hover .row-delete, .run-row:hover .row-delete, .row-delete:focus-visible { opacity: 1 }
.task-row:hover .task-meta time { opacity: 0 }
.row-delete:hover { border-color: transparent; background: rgba(226, 109, 101, .1); color: var(--bad) }
.status-dot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #666a70 }
.status-dot.running, .status-dot.labeling { background: #d29a3a }
.status-dot.completed, .status-dot.ready { background: var(--good) }
.status-dot.failed { background: var(--bad) }
.sidebar-footer { flex: 0 0 auto; padding: 6px 7px 8px }
.settings-link { width: 100%; display: flex; align-items: center; gap: 9px; justify-content: flex-start; border-color: transparent; background: transparent; color: var(--muted-strong) }
.settings-link:hover { color: var(--ink) }

.run-pane { background: var(--panel) }
.run-scroll { height: calc(100% - 52px); overflow: auto; overscroll-behavior: contain; padding: 8px 13px 18px }
.section { position: relative; padding: 17px 2px }
.section + .section::before { content: ""; position: absolute; inset: 0 4px auto; height: 1px; background: var(--line) }
.section:first-child { padding-top: 2px }
.section:last-child { border-bottom: 0 }
.eyebrow, .dialog-kicker { color: var(--muted); font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase }
.brief { margin: 7px 0 12px; font-size: 16px; font-weight: 540; line-height: 1.35; letter-spacing: -.015em; text-wrap: pretty }
.editable-text { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px }
.actions { display: flex; flex-wrap: wrap; gap: 7px; align-items: center }
.actions .ui-icon { width: 14px; height: 14px }
.section .actions { margin-top: 10px }
.dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: #666a70 }
.dot.on { background: var(--good); box-shadow: 0 0 0 3px rgba(88, 185, 157, .08) }
.run-form { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: 9px }
.run-form label span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px }
.run-form input, textarea, select, .decision input, .advanced-field input, .agent-picker-grid select { width: 100%; min-width: 0; min-height: 36px; border: 0; border-radius: 8px; background: #191919; padding: 8px 10px; box-shadow: inset 0 0 0 1px var(--line); transition: background-color 160ms ease, box-shadow 160ms ease }
input::placeholder, textarea::placeholder { color: #686868; opacity: 1 }
.run-form .primary { grid-column: 1 / -1 }
.run-form.single { grid-template-columns: 1fr }
.run-hint { color: var(--muted); font-size: 10px }
.section-heading { display: flex; align-items: center; justify-content: space-between }
.section-heading > span { min-width: 20px; border-radius: 999px; background: var(--surface); padding: 2px 6px; color: var(--muted); font-size: 9px; text-align: center }
.runs { display: grid; gap: 4px; margin-top: 10px }
.run-row { position: relative }
.run-item { width: 100%; height: auto; display: grid; justify-content: stretch; gap: 8px; padding: 11px 42px 11px 12px; border-radius: 11px; background: transparent; text-align: left }
.run-item:hover { background: rgba(255, 255, 255, .045) }
.run-item[aria-current=true] { background: var(--surface) }
.run-item[aria-current=true]::before { content: ""; position: absolute; left: 2px; top: 15px; bottom: 15px; width: 2px; border-radius: 2px; background: var(--ink) }
.run-item.stale:not([aria-current=true]) { opacity: .62 }
.run-top, .run-summary, .run-footer, .run-metric { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.run-top b { font-size: 12px; font-weight: 590 }
.run-top span, .run-footer span, .run-metric span, .run-leader { color: var(--muted); font-size: 9px }
.run-metric { justify-content: flex-start }
.run-metric strong { font-size: 21px; font-weight: 620; line-height: 1 }
.run-revision { border-radius: 999px; background: rgba(255, 255, 255, .055); padding: 2px 6px; color: var(--muted); font-size: 9px }
.run-footer { min-width: 0 }
.run-leader { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.run-bar { height: 4px; overflow: hidden; border-radius: 3px; background: rgba(255, 255, 255, .065) }
.run-bar i { display: block; height: 100%; border-radius: inherit; background: #c9c9c9 }
.empty-runs { padding: 8px 0; color: var(--muted); font-size: 11px }
.runs-empty, .list-empty { display: grid; justify-items: center; padding: 28px 16px; color: var(--muted); text-align: center }
.runs-empty-icon { width: 34px; height: 34px; display: grid; place-items: center; margin-bottom: 10px; border-radius: 10px; background: var(--surface); color: var(--muted-strong) }
.runs-empty b, .list-empty b { margin-bottom: 4px; color: var(--muted-strong); font-size: 11px; font-weight: 570 }
.runs-empty > span:last-child, .list-empty span { max-width: 220px; font-size: 10px; text-wrap: pretty }
.list-empty { padding-top: 38px }
.list-empty > .ui-icon { width: 20px; height: 20px; margin-bottom: 10px; color: var(--muted) }

.proposal { margin-top: 13px; padding: 12px; border-radius: 11px; background: var(--surface) }
.proposal p { margin: 4px 0 8px; font-size: 11px }
.proposal-count { color: var(--muted); font-size: 10px }
.error { margin-top: 7px; color: var(--bad); font-size: 11px }
.error b { font-weight: 620 }
.load-error { display: grid; gap: 8px; padding: 9px; border: 1px solid rgba(226, 109, 101, .35); border-radius: 8px; color: var(--bad); font-size: 11px }
.load-error button { justify-self: start }
.clarifications { margin-top: 12px }
.clarifications summary { min-height: 32px; display: flex; align-items: center; justify-content: space-between; list-style: none; cursor: pointer }
.clarifications summary::-webkit-details-marker { display: none }
.clarifications summary::after { width: 6px; height: 6px; margin-right: 5px; border-right: 1.4px solid var(--muted); border-bottom: 1.4px solid var(--muted); content: ""; transform: rotate(45deg); transition: transform 160ms ease }
.clarifications[open] summary::after { transform: rotate(225deg) }
.clarification-list { display: grid; gap: 2px }
.clarification { display: grid; grid-template-columns: minmax(0, 1fr) 32px 32px; gap: 2px; align-items: center; margin: 0 -6px; padding: 6px 6px; border-radius: 8px; transition: background-color 150ms ease }
.clarification:hover { background: rgba(255, 255, 255, .03) }
.clarification small, .clarification span { display: block }
.clarification small { margin-bottom: 2px; color: var(--muted) }
.clarification span { overflow-wrap: anywhere; font-size: 11px }
.inline-edit, .inline-refresh, .inline-delete { width: 32px; min-height: 32px; padding: 0; background: transparent; color: var(--muted-strong) }
.inline-edit, .inline-delete { opacity: 0; transition: opacity 160ms ease, color 160ms ease, background-color 150ms ease }
.editable-text:hover .inline-edit, .clarification:hover .inline-edit, .clarification:hover .inline-delete, .inline-edit:focus-visible, .inline-delete:focus-visible { opacity: 1 }
.inline-edit:hover, .inline-refresh:hover { border-color: transparent; background: transparent; color: var(--ink) }
.inline-delete:hover { border-color: transparent; background: rgba(226, 109, 101, .1); color: var(--bad) }
.legacy-note { color: var(--muted) }
@media (hover: none) { .inline-edit, .row-delete { opacity: 1 } .task-row .task-meta time { opacity: 0 } }

.river-pane { min-width: 0; height: 100%; display: flex; flex-direction: column; background: var(--bg) }
.river-toolbar { position: relative; z-index: 2; flex: 0 0 52px; display: flex; align-items: center; gap: 6px; padding: 0 12px; box-shadow: 0 1px var(--line) }
.toggle { display: inline-flex; align-items: center; gap: 7px; border-color: transparent; background: transparent; color: var(--muted-strong) }
.toggle[aria-pressed=true] { border-color: var(--line); background: var(--surface); color: var(--ink) }
.app:not(.hide-situations) .open-situations, .app:not(.hide-runs) .open-runs { display: none }
.river-heading { min-width: 0; flex: 1; text-align: center }
.river-heading b, .river-heading span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.river-heading b { font-size: 11px; font-weight: 590 }
.river-heading span { color: var(--muted); font-size: 9px }
.agent-tools { display: flex; gap: 2px }
.agent-tools button { position: relative; background: transparent }
.river-frame { width: 100%; height: 100%; border: 0; background: var(--bg); transition: opacity 200ms ease }
.river-host { position: relative; flex: 1; min-height: 0; display: flex }
.river-host.processing .river-frame { opacity: .28 }
.river-processing { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(23, 23, 23, .32) }
.river-empty { flex: 1; display: grid; place-items: center; padding: 30px; color: var(--muted); text-align: center }
.river-empty > div { max-width: 410px }
.river-empty-icon { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 15px; background: var(--surface); color: var(--muted-strong) }
.river-empty-icon .ui-icon { width: 21px; height: 21px }
.river-empty h1 { margin: 0 0 8px; color: var(--ink); font-size: 22px; font-weight: 590; line-height: 1.15; letter-spacing: -.025em; text-wrap: balance }
.river-empty p { margin: 0; text-wrap: pretty }
.empty-world-add { width: 58px; min-height: 58px; margin: 0 auto 22px; border-radius: 50%; background: #f4f4f2; padding: 0; color: #171717; box-shadow: 0 12px 32px rgba(0, 0, 0, .32), inset 0 0 0 1px rgba(255, 255, 255, .8) }
.empty-world-add:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 16px 38px rgba(0, 0, 0, .38), inset 0 0 0 1px #fff }
.empty-world-add:active { transform: scale(.96) }
.empty-world-add .ui-icon { width: 22px; height: 22px; stroke-width: 1.25 }

.river-activity { display: flex; align-items: center; justify-content: center; gap: 16px; color: var(--ink); text-align: left }
.river-activity > div { max-width: 360px }
.river-activity b, .river-activity span { display: block }
.river-activity b { font-size: 14px; font-weight: 590; letter-spacing: -.01em }
.river-activity span { margin-top: 3px; color: var(--muted); font-size: 11px; text-wrap: pretty }
.river-orbit { width: 82px; height: 82px; flex: 0 0 auto; overflow: visible }
.river-flood { opacity: .78; mix-blend-mode: screen; animation: river-hue 11s linear infinite }
.river-activity.compact { justify-content: flex-start; gap: 10px; margin-top: 10px; padding: 8px 9px; border-radius: 9px; background: rgba(255, 255, 255, .025) }
.river-activity.compact .river-orbit { width: 34px; height: 34px }
.river-activity.compact b { font-size: 11px }
.river-activity.compact span { margin-top: 1px; font-size: 9px }
@keyframes river-hue { to { filter: hue-rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .river-flood { animation: none } }

dialog { width: min(600px, calc(100vw - 28px)); max-height: calc(100vh - 28px); overflow: auto; border: 0; border-radius: 18px; padding: 0; background: #202020; color: var(--ink); box-shadow: 0 28px 80px rgba(0, 0, 0, .52), 0 0 0 1px rgba(255, 255, 255, .07) }
dialog::backdrop { background: rgba(0, 0, 0, .68); backdrop-filter: blur(2px) }
.dialog-form { padding: 22px }
.dialog-form h2 { margin: 4px 0 0; font-size: 22px; font-weight: 620; line-height: 1.15; letter-spacing: -.025em }
.dialog-form p { margin: 7px 0 16px; color: var(--muted) }
.dialog-form textarea { min-height: 150px; resize: vertical; font-size: 14px }
.prompt-hints-loading { margin-top: 10px; color: var(--muted); font-size: 12px }
.prompt-hints { margin-top: 12px; color: var(--muted); font-size: 12px }
.prompt-hints > span { display: block; margin-bottom: 5px; color: var(--text); font-weight: 600 }
.prompt-hints ul { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none }
.prompt-hints li { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding-left: 13px; line-height: 1.45 }
.prompt-hints li::before { position: absolute; left: 2px; top: .65em; width: 3px; height: 3px; border-radius: 50%; background: currentColor; content: ""; opacity: .65 }
.hint-research { min-height: 32px; padding: 0 8px; color: var(--muted-strong); font-size: 10px }
.hint-research:hover { background: transparent; color: var(--ink) }
.hint-research .ui-icon { width: 14px; height: 14px }
.dialog-actions { position: sticky; bottom: -22px; display: flex; justify-content: flex-end; gap: 8px; margin: 20px -22px -22px; padding: 12px 22px; background: rgba(32, 32, 32, .96) }
.decision-grid { display: grid; gap: 9px }
.decision { display: block; padding: 14px; border-radius: 11px; background: var(--bg) }
.decision small { display: block; margin-bottom: 8px; color: var(--muted) }
.decision-value { display: grid; grid-template-columns: minmax(0, 1fr) 32px; gap: 8px; align-items: start; margin: 0; padding: 8px 10px; border-radius: 8px; cursor: text; min-height: 36px; box-sizing: border-box; transition: background-color 150ms ease }
.decision-value:hover { background: rgba(255, 255, 255, .03) }
.decision-value span, .decision-input { overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap; font-size: 13px; line-height: 1.45; padding: 0; margin: 0; font-weight: 400; letter-spacing: 0; box-sizing: border-box }
.decision-value span { display: block; color: var(--ink); min-height: 20px }
.decision-value .inline-edit { opacity: 0; align-self: start; margin-top: 0 }
.decision-value:hover .inline-edit, .decision-value:focus-within .inline-edit { opacity: 1 }
.decision-value.is-editing { background: rgba(255, 255, 255, .03); cursor: text }
.decision-input { display: block; width: 100%; min-width: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink); box-shadow: none; outline: none; resize: none; overflow: hidden; field-sizing: content; min-height: 20px }
.decision-input:focus { background: transparent; box-shadow: none; outline: none }
.decision-input::placeholder { color: var(--muted) }
.decision-placeholder { color: var(--muted) }
.proposal-copy { margin-bottom: 14px }
.model-dialog { width: min(680px, calc(100vw - 28px)) }
.model-dialog textarea { min-height: min(48vh, 520px) }
.code { resize: vertical; white-space: pre; tab-size: 2; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: slashed-zero }
.advanced-field { display: block; margin: 16px 0 }
.advanced-field > span { display: block; margin-bottom: 5px; font-weight: 570 }
.advanced-field small { display: block; margin-top: 5px; color: var(--muted) }
.agent-picker-grid { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.35fr) minmax(0, .8fr); gap: 7px }
.agent-picker-grid label > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 500 }
.model-label { margin: 14px 0 6px }
.developer-settings { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 13px }
.developer-settings summary { color: var(--muted-strong); cursor: pointer; user-select: none }
.sources { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 15px }
.sources a { border-radius: 999px; background: var(--surface); padding: 4px 9px; color: var(--muted); font-size: 10px; text-decoration: none }
.sources a:hover { color: var(--ink) }
.settings-dialog { width: min(720px, calc(100vw - 28px)); background: #1d1d1d }
.settings-dialog .dialog-form { padding: 0 }
.settings-header { padding: 24px 24px 4px }
.settings-content { display: grid; gap: 10px; padding: 16px 24px 4px }
.settings-group { overflow: hidden; border-radius: 12px; background: var(--bg) }
.settings-row { min-height: 70px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 220px); gap: 18px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line) }
.settings-row:last-child { border-bottom: 0 }
.settings-row b, .settings-row span { display: block }
.settings-row b { font-size: 12px; font-weight: 590 }
.settings-row div > span { margin-top: 3px; color: var(--muted); font-size: 10px }
.settings-row > .dot { justify-self: end }
.agent-settings-row { grid-template-columns: minmax(170px, .7fr) minmax(360px, 1.3fr) }
.agent-settings-row .agent-picker-grid { grid-template-columns: 1fr 1.5fr 1fr }
.theme-badge { justify-self: end; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted-strong); font-size: 10px }
.settings-section { margin: 0; border-radius: 12px; background: rgba(255, 255, 255, .025); padding: 15px }
.settings-section-title { margin-bottom: 11px }
.settings-section-title b { font-size: 12px; font-weight: 590 }
.settings-section-title span, .settings-hint { color: var(--muted); font-size: 10px }
.settings-hint { margin-top: 8px }
.key-entry { display: grid; grid-template-columns: minmax(150px, .8fr) minmax(220px, 1.4fr) auto; gap: 7px; align-items: end }
.key-entry label > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px }
.key-entry select, .key-entry input { width: 100%; min-width: 0; min-height: 36px; border: 0; border-radius: 8px; background: #191919; padding: 8px 10px; box-shadow: inset 0 0 0 1px var(--line) }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 0; background-color: #191919; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3), 0 0 0 1px rgba(255, 255, 255, .07) }
select { appearance: none; padding-right: 32px !important }
label:has(> select) { position: relative }
label:has(> select)::after { position: absolute; right: 14px; bottom: 16px; width: 6px; height: 6px; border-right: 1.4px solid var(--muted); border-bottom: 1.4px solid var(--muted); content: ""; pointer-events: none; transform: rotate(45deg) }
label:has(> select:disabled)::after { opacity: .4 }
.key-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px }
.key-chip { min-height: 26px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: rgba(255, 255, 255, .045); padding: 0 2px 0 8px }
.key-chip span { font-size: 10px }
.key-chip small { color: var(--muted); font-size: 9px }
.key-chip .icon { width: 26px; min-height: 26px }
.settings-dialog .dialog-actions { bottom: 0; margin: 16px 0 0; padding: 12px 24px; background: rgba(29, 29, 29, .96) }

.agent-drawer { position: fixed; z-index: 30; inset: 8px 8px 8px auto; width: min(390px, calc(100vw - 20px)); display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: #202020; box-shadow: -18px 0 50px rgba(0, 0, 0, .42), 0 0 0 1px var(--line); transform: translateX(105%); visibility: hidden; transition: transform 200ms ease-out, visibility 200ms }
.agent-drawer.open { visibility: visible; transform: none }
.agent-drawer > header { min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 14px }
.agent-drawer > header b, .agent-drawer > header span { display: block }
.agent-drawer > header b { font-size: 12px }
.agent-drawer > header span { max-width: 290px; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap }
.river-scope { margin: 2px 14px 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0 10px }
.river-detail .river-scope { margin: 0; padding: 10px 12px 8px }
.river-scope > div:first-child { min-width: 0 }
.river-scope small, .river-scope b, .river-scope span { display: block }
.river-scope small { margin-bottom: 2px; color: var(--muted); font-size: 8px; letter-spacing: .04em; text-transform: uppercase }
.river-scope b { max-width: 210px; overflow: hidden; font-size: 11px; font-weight: 560; text-overflow: ellipsis; white-space: nowrap }
.river-scope span { color: var(--muted); font-size: 9px }
.river-scope > button { min-height: 32px; border-radius: 8px; background: transparent; color: var(--muted-strong); padding: 0 4px; font-size: 9px }
.river-scope > button:hover { background: transparent; color: var(--ink) }
.river-scope > .error { flex-basis: 100%; margin: 0 }
.river-detail { border-top: 1px solid var(--line); background: #151515; padding-bottom: 4px }
.river-detail .world-replay { margin: 0 12px 10px }
.world-replay { margin: 0 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: #191919; padding: 10px }
.replay-title { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.replay-title small, .replay-title b { display: block }
.replay-title small { color: var(--muted); font-size: 9px }
.replay-title b { font-size: 11px }
.replay-title > span { border-radius: 999px; padding: 3px 6px; font-size: 8px }
.replay-title .exact { background: rgba(93, 157, 132, .15); color: #82c5aa }
.replay-title .mismatch { background: rgba(200, 117, 99, .15); color: #dc8b79 }
.replay-round { margin-top: 9px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center }
.replay-round > span { display: grid; grid-template-columns: 1fr auto; align-items: center; border-radius: 8px; background: rgba(255, 255, 255, .035); padding: 6px }
.replay-round small { grid-column: 1 / -1; overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap }
.replay-round strong { font-size: 17px }
.replay-round strong.cooperate { color: #82c5aa }
.replay-round strong.defect { color: #dc8b79 }
.replay-round i { color: var(--muted); font-size: 9px; font-style: normal }
.replay-round em { color: var(--muted); font-size: 8px; font-style: normal }
.replay-controls { margin-top: 8px; display: flex; align-items: center; gap: 8px }
.replay-controls button { width: 44px; min-height: 28px; padding: 0; font-size: 9px }
.replay-controls input { flex: 1; accent-color: var(--accent) }
.observed { margin: 0 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: #191919; padding: 10px }
.observed-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px }
.observed-head small { display: block; color: var(--muted); font-size: 9px }
.observed-head b { display: block; margin-top: 1px; font-size: 11px }
.observed-head button { min-height: 26px; border-radius: 8px; background: transparent; color: var(--muted-strong); padding: 0 8px; font-size: 9px }
.observed-head button:hover { color: var(--ink) }
.observed-list { margin: 8px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 3px }
.observed-list li { color: var(--muted-strong); font-size: 10px }
.observed-result { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px }
.observed-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.observed-stats small { display: block; color: var(--muted); font-size: 8px }
.observed-stats b { font-size: 12px }
.observed-note { border-radius: 8px; background: rgba(200, 117, 99, .12); color: #dc8b79; padding: 6px 8px; font-size: 9px }
.observed-row { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 6px }
.observed-name { overflow: hidden; color: var(--muted-strong); font-size: 9px; text-overflow: ellipsis; white-space: nowrap }
.observed-bar { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, .06); overflow: hidden }
.observed-bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent) }
.observed-num { color: var(--muted); font-size: 8px; font-variant-numeric: tabular-nums }
.replay-note { display: block; margin-top: 6px; color: var(--muted); font-size: 8px; line-height: 1.35 }
.world-replay > p { margin: 8px 0 0; color: var(--muted); font-size: 9px }
.chat-messages { min-height: 0; flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px }
.chat-empty { width: 100%; margin: auto; color: var(--muted); text-align: left; text-wrap: pretty }
.chat-empty > span { display: block; color: var(--ink); font-size: 15px; font-weight: 590; letter-spacing: -.015em }
.chat-empty > p { max-width: 290px; margin: 5px 0 14px; font-size: 11px }
.chat-suggestions { display: grid; gap: 10px }
.chat-suggestions button { min-height: 40px; justify-content: flex-start; border-radius: 9px; background: rgba(255, 255, 255, .035); color: var(--muted-strong); padding: 9px 12px; text-align: left; line-height: 1.3 }
.chat-suggestions button:hover { background: rgba(255, 255, 255, .07); color: var(--ink) }
.chat-entry { width: 100%; display: flex; align-items: flex-end; gap: 7px; animation: chat-message-in 220ms ease-out both }
.chat-entry.user { justify-content: flex-end }
.chat-entry.agent { justify-content: flex-start }
.chat-message { max-width: 88%; overflow: hidden; border-radius: 11px; background: rgba(255, 255, 255, .045); padding: 10px 12px; overflow-wrap: anywhere }
.chat-entry.user .chat-message { border-bottom-right-radius: 4px; background: #2a2c2f }
.chat-entry.agent .chat-message { border-bottom-left-radius: 4px }
.chat-entry.pending { align-items: center }
.chat-entry.pending .river-activity { max-width: 100%; flex: 1; margin: 0 }
.markdown-message > :first-child { margin-top: 0 }
.markdown-message > :last-child { margin-bottom: 0 }
.markdown-message p { margin: 0 0 8px }
.markdown-message h2, .markdown-message h3, .markdown-message h4 { margin: 12px 0 6px; color: var(--ink); line-height: 1.25; text-wrap: balance }
.markdown-message h2 { font-size: 15px }
.markdown-message h3 { font-size: 13px }
.markdown-message h4 { font-size: 12px }
.markdown-message ul, .markdown-message ol { margin: 6px 0 9px; padding-left: 19px }
.markdown-message li { margin: 3px 0; padding-left: 2px }
.markdown-message li::marker { color: var(--muted) }
.markdown-message strong { color: #f5f5f5; font-weight: 650 }
.markdown-message em { color: var(--muted-strong) }
.markdown-message code { border-radius: 5px; background: rgba(0, 0, 0, .24); padding: 1px 4px; color: #ddd; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace }
.markdown-message pre { max-width: 100%; overflow: auto; margin: 8px 0; border-radius: 8px; background: #151515; padding: 10px }
.markdown-message pre code { background: transparent; padding: 0; white-space: pre }
.markdown-message blockquote { margin: 8px 0; border-left: 2px solid var(--line-strong); padding-left: 10px; color: var(--muted-strong) }
.markdown-message a { color: #d7d7d7; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .28); text-underline-offset: 3px }
.markdown-message a:hover { text-decoration-color: currentColor }
.chat-form { padding: 8px 10px 10px; background: #202020 }
.chat-revise { min-height: 32px; margin-bottom: 7px; border-radius: 8px; background: rgba(255, 255, 255, .045); color: var(--muted-strong); font-size: 9px }
.chat-revise:hover { background: rgba(255, 255, 255, .08); color: var(--ink) }
.chat-quick-actions { display: grid; gap: 5px; margin-bottom: 9px }
.chat-quick-actions button { min-height: 30px; justify-content: flex-start; border-radius: 8px; background: rgba(255, 255, 255, .03); padding: 6px 9px; color: var(--muted); font-size: 9px; text-align: left }
.chat-quick-actions button:hover { color: var(--ink) }
.chat-input-shell { position: relative; border-radius: 14px; background: #181818; transition: background-color 160ms ease }
.chat-input-shell:focus-within { background: #161616 }
.chat-form textarea { min-height: 86px; resize: none; background: transparent; padding: 10px 48px 28px 11px; box-shadow: none }
.chat-form textarea:focus-visible { background: transparent; box-shadow: none }
.chat-enter-hint { position: absolute; left: 11px; bottom: 8px; color: #666; font-size: 8px; pointer-events: none }
.chat-send { position: absolute; right: 8px; bottom: 8px; width: 34px; min-height: 34px; border-radius: 50%; background: #ededed; color: #171717 }
.chat-send .ui-icon { width: 15px; height: 15px; stroke-width: 1.9 }
@keyframes chat-message-in { from { opacity: 0; transform: translateY(6px) scale(.985) } }
.mobile-scrim { display: none }
.toast-region { position: fixed; z-index: 50; right: 16px; bottom: 16px; display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none }
.undo-toast { position: relative; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 14px; overflow: hidden; border-radius: 11px; background: #ededed; color: #1b1b1b; padding: 8px 9px 8px 14px; box-shadow: 0 16px 42px rgba(0, 0, 0, .5); pointer-events: auto }
.undo-toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #414141 }
.undo-toast button { min-height: 30px; flex: 0 0 auto; background: rgba(0, 0, 0, .07); color: #111; font-weight: 620 }
.undo-toast button:hover { background: rgba(0, 0, 0, .12) }
.undo-toast::after { position: absolute; inset: auto 0 0; height: 2px; background: rgba(0, 0, 0, .28); content: ""; transform-origin: left; animation: undo-timeout 6s linear forwards }
@keyframes undo-timeout { to { transform: scaleX(0) } }

@media (max-width: 900px) {
  .app, .app.agent-open, .app.hide-situations, .app.hide-runs, .app.hide-situations.hide-runs { display: block; padding-right: 0 }
  .pane { position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(86vw, 330px); visibility: visible !important; box-shadow: 16px 0 44px rgba(0, 0, 0, .42); transform: translateX(-105%); transition: transform 200ms ease }
  .run-pane { width: min(90vw, 390px) }
  .app.mobile-situations .situations, .app.mobile-runs .run-pane { transform: none }
  .river-pane { height: 100% }
  .app:not(.hide-situations) .open-situations, .app:not(.hide-runs) .open-runs { display: inline-flex }
  .toggle { padding: 0 9px }
  .toggle .ui-icon { display: none }
  .agent-tools { margin-left: auto }
  .agent-drawer { inset: 6px; width: auto }
  .mobile-scrim { position: fixed; z-index: 19; inset: 0; display: block; width: 100%; min-height: 100%; border-radius: 0; background: rgba(0, 0, 0, .48); cursor: default }
  .settings-row { grid-template-columns: 1fr }
  .agent-picker-grid, .agent-settings-row .agent-picker-grid { grid-template-columns: 1fr }
  .key-entry { grid-template-columns: 1fr }
  .settings-section-title { display: block }
  .settings-section-title span { display: block; margin-top: 3px }
  .settings-row select, .settings-row > .dot, .theme-badge { justify-self: stretch }
  .settings-row > .dot { justify-self: start }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important }
}

/* ── Facts: the single input surface ───────────────────────────────────────── */
.facts-section .section-heading { align-items: baseline }
.link-button { min-height: 24px; border: 0; border-radius: 7px; background: transparent; color: var(--muted-strong); padding: 0 6px; font-size: 10px; cursor: pointer }
.link-button:hover:not(:disabled) { background: rgba(255, 255, 255, .05); color: var(--ink) }
.link-button:disabled { opacity: .4; cursor: default }

.fact-list { display: grid; gap: 1px; margin: 6px 0 0; padding: 0; list-style: none }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start; margin: 0 -6px; padding: 6px; border-radius: 8px; transition: background-color 150ms ease }
.fact:hover { background: rgba(255, 255, 255, .03) }
.fact-text { display: block; width: 100%; border: 0; background: transparent; color: var(--ink); padding: 0; font: inherit; font-size: 11.5px; line-height: 1.45; text-align: left; overflow-wrap: anywhere; cursor: text }
.fact.outcome .fact-text { color: var(--muted-strong) }
.fact-input { width: 100%; box-sizing: border-box; resize: none; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 7px; background: rgba(255, 255, 255, .04); color: var(--ink); padding: 5px 7px; font: inherit; font-size: 11.5px; line-height: 1.45 }
.fact-tag { margin-left: 6px; border-radius: 999px; background: rgba(255, 255, 255, .07); color: var(--muted); padding: 1px 5px; font-size: 8px; vertical-align: middle }

.fact-tools { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity 150ms ease }
.fact:hover .fact-tools, .fact:focus-within .fact-tools { opacity: 1 }
.fact-kind { border: 0; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--muted); padding: 2px 7px; font-size: 8px; white-space: nowrap; cursor: pointer }
.fact-kind:hover:not(:disabled) { background: rgba(255, 255, 255, .12); color: var(--ink) }
.fact-kind.outcome { background: rgba(93, 157, 132, .16); color: #82c5aa }
.fact-remove { width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer }
.fact-remove:hover:not(:disabled) { background: rgba(200, 117, 99, .16); color: #dc8b79 }

.fact-group-label { margin: 13px 0 3px; color: var(--muted-strong); font-size: 9px; text-transform: uppercase; letter-spacing: .04em }
.fact-group-label span { margin-left: 6px; color: var(--muted); font-size: 9px; text-transform: none; letter-spacing: 0 }

.fact-add { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end }
.fact-add textarea { width: 100%; box-sizing: border-box; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, .04); color: var(--ink); padding: 7px 8px; font: inherit; font-size: 11px }
.fact-add textarea::placeholder { color: var(--muted) }
.fact-add button { min-height: 30px; border-radius: 8px; font-size: 10px }

/* ── Open questions: always optional, never a gate ─────────────────────────── */
.question-list { display: grid; gap: 4px; margin: 5px 0 0; padding: 0; list-style: none }
.question { border: 1px solid var(--line); border-radius: 9px; padding: 8px }
.question-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: start }
.question-prompt { font-size: 11px; line-height: 1.4; overflow-wrap: anywhere }
.question-dismiss { width: 20px; height: 20px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; line-height: 1; cursor: pointer }
.question-dismiss:hover:not(:disabled) { background: rgba(255, 255, 255, .07); color: var(--ink) }
.question-actions { margin-top: 6px; display: flex; gap: 5px }
.question-actions button { min-height: 26px; border-radius: 7px; padding: 0 9px; font-size: 9.5px }
.question-answer textarea { width: 100%; box-sizing: border-box; margin-top: 6px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 8px; background: rgba(255, 255, 255, .04); color: var(--ink); padding: 6px 8px; font: inherit; font-size: 11px }
.question-sources { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px }
.question-sources a { color: var(--muted); font-size: 9px; text-decoration: underline }

.stale-hint { margin-top: 11px; border-radius: 8px; background: rgba(178, 140, 87, .13); color: #d8b071; padding: 6px 8px; font-size: 9.5px }

body { background: #171717; margin: 0; padding: 16px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start }

figcaption { margin-top: 6px; color: #9a9a9a; font: 11px/1.4 -apple-system, system-ui, sans-serif }
